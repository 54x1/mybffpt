version: 2
updates:
  # Application and tooling dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Majors are grouped into a single PR so they stay reviewable without
      # being ignored outright: a global ignore on semver-major would also
      # suppress Dependabot security updates that need a major bump
      # (SOC 2 CC7.1).
      major:
        update-types:
          - "major"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the CI, CodeQL and scheduled workflows (CC6.8 / CC9.2).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
