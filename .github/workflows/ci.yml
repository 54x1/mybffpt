name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least-privilege token for every job (SOC 2 CC6.1 / CC6.3). Jobs that need
# more must request it explicitly in their own permissions block.
permissions:
  contents: read

# One run per ref at a time; superseded runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'npm'

      # Lockfile-exact install with dependency lifecycle scripts disabled
      # (supply-chain control, CC6.8). No dependency in this project needs an
      # install/postinstall script; Playwright browsers are installed below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Copy tesseract OCR runtime assets from node_modules into public/ocr so
      # the built app ships them (CSP 'self', no CDN). This is our own script,
      # not a dependency lifecycle hook, so it stays within the --ignore-scripts
      # supply-chain control above.
      - name: Copy OCR runtime assets
        run: node scripts/copy-ocr-assets.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # type-check, unit, license headers, third-party notices, build,
      # npm audit (high+), axe-core accessibility scan
      - name: Run verification suite
        run: npm run verify

      - name: Generate SBOM (CycloneDX, production dependencies)
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          retention-days: 14
